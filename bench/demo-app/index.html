<h2>Orders</h2>
<div class="wrap">
  <div>
    <div id="banner"></div>
    <div id="list"></div>
  </div>
  <div class="side">
    <div id="detail"></div>
    <h4>New order</h4>
    <div class="form">
      <select id="sku">
        <option value="SKU-COFFEE">SKU-COFFEE</option>
        <option value="SKU-MUG">SKU-MUG</option>
        <option value="SKU-BEANS">SKU-BEANS</option>
      </select>
      <input id="qty" type="number" value="1" min="1" />
      <button id="place">Place</button>
    </div>
  </div>
</div>
